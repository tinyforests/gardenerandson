<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"><title>Private project archive · Gardener & Son</title>
<style>:root{--beige:#fff0dc;--green:#3d4535}*{box-sizing:border-box;border-radius:0}body{background:var(--beige);color:var(--green);font:16px/1.6 "IBM Plex Sans",sans-serif;max-width:900px;margin:40px auto;padding:24px}h1,h2{font-family:Fraunces,serif}button,input{font:inherit;padding:10px;border:1px solid var(--green);background:transparent;color:inherit}button{cursor:pointer}input,select{max-width:100%}button:disabled{opacity:.5}article{border-top:1px solid;padding:18px 0}pre{white-space:pre-wrap;font:inherit}small{display:block}a{color:inherit}</style>
<a href="studio.html">← Plant Studio</a><h1>Private project archive</h1><p>Notion journal text is visible to the studio and the corresponding verified garden steward. Publication is controlled by the steward from their Registry garden profile. Photos remain in the original export for later.</p>
<p id="auth"></p><form id="login" hidden><label>Studio admin key <input id="key" type="password" required autocomplete="off"></label><button>Sign in</button></form>
<section id="tools" hidden><h2>Import text archive</h2><label for="file">Private text bundle</label> <input id="file" type="file" accept=".json"><p id="preview"></p><button id="import" disabled>Import private text</button><button id="refresh">Refresh archive</button><p role="status" id="status"></p><h2>Journal archive</h2><label>Filter by project <select id="filter"><option value="">All projects</option></select></label><p id="match"></p><div id="records"></div></section>
<script>
(function(){'use strict';
var endpoint='https://script.google.com/macros/s/AKfycbwGIau58khBRKYgq5SYwu0QjCWPa5h2dKyz4nPoeU9YMKlPN5BRXUz0LmzF7jZrqrRC/exec',token=localStorage.getItem('gs-plants-admin-token')||'',bundle=null,records=[],projects=[];
var $=function(id){return document.getElementById(id);};
function post(type,op,data){return fetch(endpoint,{method:'POST',body:JSON.stringify(Object.assign({submission_type:type,op:op,admin_token:token},data||{}))}).then(function(r){return r.json();}).then(function(r){if(!r.ok)throw new Error(r.error||'Request failed');return r;});}
function render(){ $('records').replaceChildren();var chosen=$('filter').value;records.filter(function(e){return !chosen||(e.project_ids||[]).indexOf(chosen)!==-1;}).forEach(function(e){var a=document.createElement('article'),h=document.createElement('h3'),s=document.createElement('small'),b=document.createElement('pre');h.textContent=e.title;s.textContent=(e.garden_id||'Unlinked — Registry match requires review')+' · '+e.visibility+' · '+(e.assets||[]).length+' retained attachment references';b.textContent=e.body;a.append(h,s,b);$('records').append(a);});}
async function load(){try{var result=await post('field_record','list');records=result.records;var ps=await post('plant_studio','list_projects');projects=ps.projects||[];$('filter').replaceChildren(new Option('All projects',''));projects.filter(function(p){return (p.source||'').startsWith('notion-design:');}).forEach(function(p){$('filter').add(new Option(p.name,p.source.slice(14)));});$('status').textContent=records.length+' archived pages. '+projects.filter(function(p){return(p.source||'').startsWith('notion-design:');}).length+' Notion design projects.';render();}catch(e){$('status').textContent=e.message;}}
$('filter').onchange=function(){render();$('match').replaceChildren();if(!this.value)return;var p=projects.find(function(p){return p.source==='notion-design:'+$('filter').value;});var label=document.createElement('label');label.textContent='Confirmed Registry garden ID ';var input=document.createElement('input');input.value=p.garden_id||'';input.placeholder='ER-AU-VIC-…';var button=document.createElement('button');button.textContent='Confirm garden match';button.onclick=async function(){if(!confirm('Link this project and its journal notes to '+input.value+'? Confirm the address matches.'))return;try{var r=await post('field_record','link_project',{project_id:$('filter').value,garden_id:input.value.trim()});await load();$('match').replaceChildren();$('status').textContent='Garden match saved; '+r.linked+' notes linked.';}catch(e){$('status').textContent=e.message;}};label.append(input);$('match').append(label,button);};$('refresh').onclick=load;
$('file').onchange=async function(){try{bundle=JSON.parse(await this.files[0].text());if(bundle.format!=='gs-notion-text-v1'||!Array.isArray(bundle.projects)||!Array.isArray(bundle.entries))throw new Error('Choose a valid text archive bundle');$('preview').textContent=bundle.projects.length+' projects, '+bundle.entries.length+' journal pages. All imported notes start private. Existing source IDs are skipped.';$('import').disabled=false;}catch(e){bundle=null;$('preview').textContent=e.message;$('import').disabled=true;}};
$('import').onclick=async function(){if(!bundle)return;this.disabled=true;try{var made=0,skipped=0;for(var i=0;i<bundle.projects.length;i+=20){$('status').textContent='Importing projects…';await post('plant_studio','import_projects',{projects:bundle.projects.slice(i,i+20)});}for(var j=0;j<bundle.entries.length;j+=10){$('status').textContent='Importing private journal pages '+j+' / '+bundle.entries.length;var r=await post('field_record','import',{entries:bundle.entries.slice(j,j+10)});made+=r.imported;skipped+=r.skipped;}await load();$('status').textContent+=' Imported '+made+' pages; '+skipped+' already present.';}catch(e){$('status').textContent=e.message+' — retry is safe; existing sources are skipped.';}finally{this.disabled=false;}};
function unlock(){ $('login').hidden=!!token;$('tools').hidden=!token;$('auth').textContent=token?'Studio session active. Access is verified by the Registry.':'Sign in with your existing Studio admin key.';if(token)load();}
$('login').onsubmit=function(e){e.preventDefault();token=$('key').value.trim();localStorage.setItem('gs-plants-admin-token',token);$('key').value='';unlock();};unlock();
})();
</script></html>
