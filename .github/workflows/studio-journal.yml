name: Refresh studio journal
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-journal
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Import published headlines
        run: python studio-screen/import-journal.py
      - name: Save changed journal
        run: |
          if git diff --quiet -- studio-screen/journal.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio-screen/journal.json
          git commit -m 'Refresh studio journal headlines'
          git pull --rebase
          git push
